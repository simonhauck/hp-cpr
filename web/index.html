<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Companion-App für den High-Performance-CPR-Standard: Reanimations-Timer und Ablauf-Unterstützung.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HP-CPR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HP-CPR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B00205">
  <style>
    html, body { margin: 0; height: 100%; background: #FFF8F6; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #FFF8F6; color: #410002;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 250ms ease-out;
    }
    #splash img { width: 128px; height: 128px; }
    #splash span { font-size: 24px; font-weight: 600; letter-spacing: 0.04em; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #1C1B1F; }
      #splash { color: #E6E1E5; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/splash-icon.png" alt="" width="128" height="128">
    <span>HP-CPR</span>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var done = false;
      function removeSplash() {
        if (done) return;
        done = true;
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', removeSplash);
      // Fallback so a failed or slow boot never leaves a permanent overlay.
      setTimeout(removeSplash, 15000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
