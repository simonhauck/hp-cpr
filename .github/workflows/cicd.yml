name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cicd-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release-please:
    name: Release Please
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # release-please evaluates merged PRs, not this run's SHA. If main has
      # advanced, let the newer run create the release from the checked commit.
      - name: Check that main has not advanced
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release-please because main advanced to ${current}."
          fi

      - name: Run release-please
        id: release
        if: steps.current.outputs.is_current == 'true'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release
    needs:
      - checks
      - release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Release artifacts must come from the tagged commit, not from the
      # commit that happened to trigger this workflow run.
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Nix and caches
        uses: ./.github/actions/setup
        with:
          nix-cache-prefix: nix-release
          nix-restore-prefixes: |
            nix-ci-${{ runner.os }}-
            nix-android-${{ runner.os }}-
          save-nix-cache: false
          gradle-cache: true

      - name: Build web
        uses: ./.github/actions/build-web

      - name: Build APK
        uses: ./.github/actions/build-apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "hp-cpr-${VERSION}-debug-signed.apk"
          (cd build/web && zip -r "../../hp-cpr-web-${VERSION}.zip" .)
          gh release upload "$TAG" \
            "hp-cpr-${VERSION}-debug-signed.apk" \
            "hp-cpr-web-${VERSION}.zip" \
            --clobber
