name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nix and caches
        uses: ./.github/actions/setup
        with:
          nix-cache-prefix: nix-ci

      - name: Format, analyze, and test
        uses: ./.github/actions/nix
        with:
          command: |
            dart format --output=none --set-exit-if-changed lib test
            flutter analyze
            flutter test
            flutter gen-l10n
            git diff --exit-code -- lib/l10n
            flutter test --platform chrome

      - name: Build web
        uses: ./.github/actions/build-web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 7

      - name: Lint workflows and Nix
        uses: ./.github/actions/nix
        with:
          command: |
            actionlint
            nixfmt --check flake.nix

  android:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Nix and caches
        uses: ./.github/actions/setup
        with:
          nix-cache-prefix: nix-android
          gradle-cache: true

      - name: Build APK
        uses: ./.github/actions/build-apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
